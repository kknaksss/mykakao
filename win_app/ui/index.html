<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mykakao 설정</title>
<style>
:root{
  --kakao:#FEE500; --kakao-dim:#F5DC00; --on-kakao:#3B1E1E;
  --chat-wall:#9DB2CE; --bubble-me:#FEE500; --bubble-other:#FFFFFF;
  --ink:#1A1A1A; --ink-2:#5C5A57; --ink-3:#9A9691;
  --surface:#FFFFFF; --ground:#EDEEF1; --panel:#F7F7F9;
  --line:#E3E3E6; --line-strong:#D2D2D6;
  --ok:#17B26A; --ok-ink:#0E7A47; --wait:#E8912A; --wait-ink:#B26B12; --off:#B0AEB2;
  --sel:#FFFBE0; --sel-line:#F2DE4D;
  --radius:14px; --shadow:0 1px 2px rgba(30,25,20,.05), 0 8px 22px rgba(30,25,20,.06);
  --font:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
}
:root:not([data-theme="light"]){@media (prefers-color-scheme: dark){
  --chat-wall:#1F2733; --bubble-other:#2C2C31;
  --ink:#ECEAE6; --ink-2:#A6A29C; --ink-3:#726E69;
  --surface:#1C1C20; --ground:#141417; --panel:#232329;
  --line:#2C2C31; --line-strong:#3A3A40;
  --ok-ink:#4FD495; --wait-ink:#E7A44E; --sel:#33301E; --sel-line:#5C5426;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --chat-wall:#1F2733; --bubble-other:#2C2C31;
  --ink:#ECEAE6; --ink-2:#A6A29C; --ink-3:#726E69;
  --surface:#1C1C20; --ground:#141417; --panel:#232329;
  --line:#2C2C31; --line-strong:#3A3A40;
  --ok-ink:#4FD495; --wait-ink:#E7A44E; --sel:#33301E; --sel-line:#5C5426;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);
  -webkit-font-smoothing:antialiased;line-height:1.5}
.app{height:100vh;display:flex;flex-direction:column;background:var(--surface)}
.icon{width:18px;height:18px;flex:none;stroke:currentColor;stroke-width:1.7;
  fill:none;stroke-linecap:round;stroke-linejoin:round}
.head{display:flex;align-items:center;gap:14px;padding:12px 22px;
  background:var(--kakao);color:var(--on-kakao);border-bottom:1px solid rgba(0,0,0,.06)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.02em}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--on-kakao);
  color:var(--kakao);display:grid;place-items:center}
.brand .mark .icon{width:18px;height:18px;stroke-width:2}
.who{margin-left:auto;display:flex;align-items:center;gap:9px;
  background:rgba(0,0,0,.07);padding:6px 13px 6px 9px;border-radius:999px;font-size:13px;font-weight:500}
.who .avatar{width:22px;height:22px;border-radius:50%;background:var(--on-kakao);
  color:var(--kakao);display:grid;place-items:center}
.who .avatar .icon{width:13px;height:13px;stroke-width:2}
.who .name{font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(23,178,106,.22)}
.dot.off{background:#E5484D;box-shadow:0 0 0 3px rgba(229,72,77,.22)}
.who .stat{display:flex;align-items:center;gap:6px}
.tabs{display:flex;gap:2px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.tab{appearance:none;border:0;background:none;font-family:inherit;cursor:pointer;
  padding:13px 16px 11px;font-size:14.5px;font-weight:700;color:var(--ink-3);
  border-bottom:2.5px solid transparent;display:flex;align-items:center;gap:8px;transition:color .12s}
.tab .icon{width:17px;height:17px}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--on-kakao)}
:root:not([data-theme="light"]){@media(prefers-color-scheme:dark){.tab[aria-selected="true"]{border-bottom-color:var(--kakao)}}}
:root[data-theme="dark"] .tab[aria-selected="true"]{border-bottom-color:var(--kakao)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column}
.panel[hidden]{display:none}
.ravatar{width:40px;height:40px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff}
.ravatar .icon{width:21px;height:21px;stroke-width:1.9}
.rmeta{min-width:0;flex:1}
.rname{font-weight:700;font-size:14px;color:var(--ink);display:flex;align-items:center;gap:7px}
.rname .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:11px;font-weight:700;padding:1.5px 7px;border-radius:6px;flex:none;background:var(--ground);color:var(--ink-2)}
.rsub{font-size:12px;color:var(--ink-3);margin-top:2px}
.transfer{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:0}
.col{display:flex;flex-direction:column;min-height:0}
.col.left{border-right:1px solid var(--line)}
.col-head{display:flex;align-items:center;gap:8px;padding:14px 20px 10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.col-head .n{color:var(--on-kakao);background:var(--kakao);border-radius:999px;padding:0 8px;font-size:12px;min-width:22px;text-align:center}
:root:not([data-theme="light"]){@media(prefers-color-scheme:dark){.col-head .n{color:#231d05}}}
.col-head .hint-r{margin-left:auto;font-size:11.5px;font-weight:500;color:var(--ink-3)}
.scroller{flex:1;overflow-y:auto;padding:0 14px 14px}
.item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:12px;cursor:pointer;transition:background .1s}
.item:hover{background:var(--panel)}
.item .add{margin-left:auto;flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  color:var(--ink-3);background:var(--ground);opacity:0;transition:opacity .1s}
.item:hover .add{opacity:1}
.item .add .icon{width:18px;height:18px;stroke-width:2.2}
.item.picked{opacity:.4;pointer-events:none}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3);font-size:13px;
  display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .icon{width:34px;height:34px;stroke-width:1.4;color:var(--line-strong)}
.col.right{background:var(--panel)}
.titem{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:12px;background:var(--surface);
  border:1px solid var(--line);margin-bottom:8px}
.stat-badge{flex:none;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px}
.stat-badge.collecting,.stat-badge.done{color:var(--ok-ink);background:rgba(23,178,106,.13)}
.stat-badge.waiting,.stat-badge.pending{color:var(--wait-ink);background:rgba(232,145,42,.15)}
.stat-badge.error{color:#E5484D;background:rgba(229,72,77,.13)}
.stat-badge .icon{width:12px;height:12px;stroke-width:2.3}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid rgba(23,178,106,.3);border-top-color:var(--ok-ink);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rm{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3);cursor:pointer;background:transparent}
.rm:hover{background:var(--ground);color:#D1435B}
.rm .icon{width:16px;height:16px;stroke-width:2.2}
.bar{display:flex;align-items:center;gap:14px;padding:13px 22px;border-top:1px solid var(--line);background:var(--surface)}
.note{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;color:var(--ink-2);max-width:60ch}
.note .icon{width:16px;height:16px;color:var(--wait-ink);margin-top:1px;flex:none}
.spacer{flex:1}
.btn{appearance:none;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;border-radius:11px;
  padding:10px 20px;display:flex;align-items:center;gap:8px;border:1px solid transparent;transition:filter .1s,background .1s}
.btn .icon{width:17px;height:17px;stroke-width:2}
.btn.ghost{background:var(--surface);border-color:var(--line-strong);color:var(--ink-2)}
.btn.ghost:hover{background:var(--ground);color:var(--ink)}
.btn.primary{background:var(--kakao);color:var(--on-kakao)}
.btn.primary:hover{filter:brightness(.97)}
.btn.primary:disabled{background:var(--ground);color:var(--ink-3);cursor:default}
.btn.danger{background:var(--surface);border-color:rgba(229,72,77,.4);color:#E5484D}
.btn.danger:hover{background:rgba(229,72,77,.1)}
.dirtydot{width:7px;height:7px;border-radius:50%;background:#D1435B;margin-left:-3px}
.split{flex:1;min-height:0;display:grid;grid-template-columns:280px 1fr;grid-template-rows:minmax(0,1fr);overflow:hidden}
.side{border-right:1px solid var(--line);overflow-y:auto;min-height:0;background:var(--surface)}
.side-head{padding:14px 18px 8px;font-size:12px;font-weight:700;color:var(--ink-3)}
.conv{display:flex;align-items:center;gap:11px;padding:11px 16px;cursor:pointer;border-left:3px solid transparent}
.conv:hover{background:var(--ground)}
.conv.on{background:var(--sel);border-left-color:var(--kakao)}
.conv .rmeta{min-width:0}
.conv .last{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;display:flex;align-items:center;gap:5px}
.mini{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700}
.mini.collecting{color:var(--ok-ink)} .mini.waiting{color:var(--wait-ink)}
.mini .icon{width:11px;height:11px;stroke-width:2.4} .mini .spin{width:10px;height:10px}
.chat{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--chat-wall)}
.searchbar{display:flex;align-items:center;gap:8px;margin:0 18px 8px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.searchbar:focus-within{border-color:var(--sel-line)}
.searchbar .icon{width:16px;height:16px;color:var(--ink-3);flex:none}
.searchbar input{border:0;background:none;outline:none;font-family:inherit;font-size:13.5px;color:var(--ink);width:100%}
.searchbar input::placeholder{color:var(--ink-3)}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.chat-head .rname{font-size:15px}
.chat-head .cnt{font-size:12.5px;color:var(--ink-3);font-weight:500}
.log{flex:1;overflow-y:auto;padding:18px 20px 22px;display:flex;flex-direction:column;gap:3px}
.daysep{align-self:center;font-size:11.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.28);padding:4px 13px;border-radius:999px;margin:2px 0 12px}
.msg{display:flex;gap:9px;max-width:74%;margin-top:9px}
.msg .mav{width:36px;height:36px;border-radius:13px;flex:none;display:grid;place-items:center;color:#fff}
.msg .mav .icon{width:19px;height:19px}
.mbody{min-width:0}
.sender{font-size:12.5px;font-weight:500;color:#33404F;margin:0 0 4px 2px}
:root:not([data-theme="light"]){@media(prefers-color-scheme:dark){.sender{color:#B7C4D4}}}
:root[data-theme="dark"] .sender{color:#B7C4D4}
.rowb{display:flex;align-items:flex-end;gap:6px}
.bubble{padding:8px 12px;border-radius:4px 16px 16px 16px;font-size:14px;color:var(--ink);background:var(--bubble-other);box-shadow:0 1px 1px rgba(0,0,0,.08);word-break:break-word;white-space:pre-wrap}
.btime{font-size:10.5px;color:rgba(255,255,255,.85);flex:none;margin-bottom:2px}
.msg.me{margin-left:auto;flex-direction:row-reverse}
.msg.me .bubble{background:var(--bubble-me);color:var(--on-kakao);border-radius:16px 4px 16px 16px}
.msg.me .rowb{flex-direction:row-reverse}
.bubble.photo{padding:3px;background:var(--bubble-other);white-space:normal}
.msg.me .bubble.photo{background:var(--bubble-me)}
.pimg{display:block;max-width:240px;max-height:320px;width:auto;height:auto;border-radius:12px;cursor:zoom-in;background:var(--ground)}
.bubble.plost,.bubble.ppend{display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);font-size:13px;white-space:normal}
.bubble.plost .icon{width:14px;height:14px;color:#E5484D}
.bubble.plost small,.bubble.ppend{color:var(--ink-3)}
.state-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center}
.state-mid .ring{width:52px;height:52px;border-radius:50%;border:4px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}
.state-mid .waiticon{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.85);display:grid;place-items:center;color:var(--wait-ink)}
.state-mid .waiticon .icon{width:28px;height:28px;stroke-width:1.7}
.state-mid h3{margin:0;font-size:16px;color:#fff}
.state-mid p{margin:0;font-size:13px;color:rgba(255,255,255,.9);max-width:38ch}
@media (max-width:760px){.split{grid-template-columns:1fr}.side{display:none}.transfer{grid-template-columns:1fr}.col.left{border-right:0;border-bottom:1px solid var(--line)}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-4a8 8 0 0 1 8-13h2a8 8 0 0 1 8 6Z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 19c0-3.4 3-5.2 6.5-5.2s6.5 1.8 6.5 5.2"/><path d="M16 5.2A3.4 3.4 0 0 1 16 12"/><path d="M17.5 13.9c2.9.3 4.5 2 4.5 4.6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19.5 7"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 4.5h11l3 3V19a.5.5 0 0 1-.5.5h-13A.5.5 0 0 1 5 19Z"/><path d="M8 4.5v5h7v-5"/><rect x="8.5" y="13" width="7" height="6.5"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 13.5 6.5 6h11L20 13.5"/><path d="M4 13.5V19h16v-5.5h-5a3 3 0 0 1-6 0Z"/></symbol>
</svg>

<div class="app">
  <header class="head">
    <div class="brand"><span class="mark"><svg class="icon"><use href="#i-chat"/></svg></span>mykakao</div>
    <div class="who"><span class="avatar"><svg class="icon"><use href="#i-user"/></svg></span>
      <span class="name" id="me-name">-</span><span class="stat"><span class="dot off" id="me-dot"></span> <span id="me-stat">확인 중</span></span></div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" aria-controls="p-set" id="t-set">
      <svg class="icon"><use href="#i-save"/></svg> 채팅방 설정</button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="p-chat" id="t-chat">
      <svg class="icon"><use href="#i-chat"/></svg> 채팅방 + 채팅목록</button>
  </nav>

  <section class="panel" id="p-set" role="tabpanel" aria-labelledby="t-set">
    <div class="transfer">
      <div class="col left">
        <div class="col-head">내 카톡 대화방 <span class="n" id="cnt-all">0</span>
          <span class="hint-r">방을 눌러 오른쪽으로 추가</span></div>
        <div class="searchbar"><svg class="icon"><use href="#i-search"/></svg><input id="room-search" type="search" placeholder="대화방 이름 검색" autocomplete="off"></div>
        <div class="scroller" id="all-list"></div>
      </div>
      <div class="col right">
        <div class="col-head">추적 중인 방 <span class="n" id="cnt-track">0</span>
          <span class="hint-r">껐다 켜도 자동으로 최신 유지</span></div>
        <div class="scroller" id="track-list"></div>
      </div>
    </div>
    <div class="bar">
      <div class="note"><svg class="icon"><use href="#i-clock"/></svg>
        <span><b>대기 중</b>인 방은 지금 닫혀 있어요 — 카톡에서 열리거나 메시지가 오면 <b>자동으로</b> 가져옵니다.</span></div>
      <button class="btn danger" id="btn-reset"><svg class="icon"><use href="#i-x"/></svg> 초기화</button>
      <div class="spacer"></div>
      <button class="btn ghost" id="btn-cancel">취소</button>
      <button class="btn primary" id="btn-save" disabled><svg class="icon"><use href="#i-save"/></svg> 저장</button>
    </div>
  </section>

  <section class="panel" id="p-chat" role="tabpanel" aria-labelledby="t-chat" hidden>
    <div class="split">
      <aside class="side">
        <div class="side-head">추적 중인 대화방</div>
        <div id="conv-list"></div>
      </aside>
      <div class="chat" id="chat-area">
        <div class="chat-head"><span class="rname" id="chat-title">대화방을 선택하세요</span><span class="cnt" id="chat-sub"></span></div>
        <div class="log" id="chat-log"></div>
      </div>
    </div>
  </section>
</div>

<script>
const $=s=>document.querySelector(s);
const api=async(p,o)=>{const r=await fetch(p,o);if(!r.ok)throw new Error(p+" "+r.status);return r.json();};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const icon=id=>`<svg class="icon"><use href="#${id}"/></svg>`;
const PALETTE=['#6FB1E4','#F2A65A','#5FBF9B','#B98BE0','#E8879B','#7CC4C0','#E0B15F','#8FA6E0','#E88F8F','#7C9BE0'];
const colorOf=id=>PALETTE[Math.abs(Number(id)%PALETTE.length)];
const kindLabel=k=>k==='direct'?'개인':k==='group'?'단체':k==='memo'?'메모':'';
const roomName=r=>(r.title&&r.title.trim())?r.title:('대화방 '+r.chat_id);
const avatarSvg=r=>`<span class="ravatar" style="background:${colorOf(r.chat_id)}">${icon((r.kind==='direct'||r.kind==='memo')?'i-user':'i-users')}</span>`;

let ROOMS=[], STATE={}, MY_UID=0;
let trackedSet=new Set(), savedSet=new Set(), loadedOnce=false, roomFilter='';
let curRoom=null, curES=null, renderedIds=new Set(), curDay=null;

function roomById(id){return ROOMS.find(r=>r.chat_id===id);}
function isDirty(){ if(trackedSet.size!==savedSet.size) return true; for(const id of trackedSet) if(!savedSet.has(id)) return true; return false; }

// status for a tracked room: pending(added, not saved) → else server collect_status
function statusOf(id){ if(!savedSet.has(id)) return 'pending'; const r=roomById(id); return r&&r.collect_status?r.collect_status:'idle'; }
function statBadge(id){
  const s=statusOf(id), r=roomById(id);
  if(s==='collecting') return `<span class="stat-badge collecting"><span class="spin"></span> 수집 중</span>`;
  if(s==='done') return `<span class="stat-badge done">${icon('i-check')} 완료 · ${(r&&r.collected_rows!=null?r.collected_rows:0)}행</span>`;
  if(s==='error') return `<span class="stat-badge error">${icon('i-x')} 오류</span>`;
  return `<span class="stat-badge waiting">${icon('i-clock')} 대기 중</span>`; // waiting/pending/idle
}

// ── header (state) ──
async function loadState(){
  try{
    STATE=await api('/api/state'); MY_UID=STATE.my_user_id||0;
    const inLogin = STATE.state==='UP_LOGGED_IN';
    $('#me-name').textContent = inLogin ? (STATE.me||'(이름 없음)') : '-';
    $('#me-dot').className = 'dot'+(inLogin?'':' off');
    $('#me-stat').textContent = inLogin?'로그인 중':(STATE.state==='UP_LOGGED_OUT'?'로그아웃':'미실행');
  }catch(e){ $('#me-stat').textContent='조회 실패'; }
}

// ── rooms ──
async function loadRooms(){
  let rows=[]; try{ rows=await api('/api/rooms'); }catch(e){ return; }
  ROOMS=rows;
  savedSet=new Set(rows.filter(r=>r.tracked).map(r=>r.chat_id));
  // 첫 로드거나 편집 중이 아니면 서버(저장 테이블)와 동기화. 첫 로드엔 trackedSet 이 비어 isDirty 가 참이 되므로 loadedOnce 로 가드.
  if(!loadedOnce || !isDirty()) trackedSet=new Set(savedSet);
  loadedOnce=true;
  renderTransfer(); renderConvList();
}

function renderTransfer(){
  const all=$('#all-list'), tl=$('#track-list');
  all.innerHTML=''; tl.innerHTML='';
  // 좌측 = 아직 추적하지 않는 방(추적 방은 우측으로 이동). 우측 = 추적 중인 방.
  let untracked=ROOMS.filter(r=>!trackedSet.has(r.chat_id));
  if(roomFilter) untracked=untracked.filter(r=>roomName(r).toLowerCase().includes(roomFilter));
  untracked.forEach(r=>{
    const el=document.createElement('div');
    el.className='item';
    const kl=kindLabel(r.kind), mc=(r.member_count!=null)?r.member_count+'명':'';
    el.innerHTML=`${avatarSvg(r)}<div class="rmeta"><div class="rname"><span class="txt">${esc(roomName(r))}</span>${kl?`<span class="chip">${kl}</span>`:''}</div>
      <div class="rsub">${mc}${mc?' · ':''}${r.open?'열림':'닫힘'}</div></div><span class="add">${icon('i-plus')}</span>`;
    el.onclick=()=>{ trackedSet.add(r.chat_id); renderTransfer(); updateDirty(); };
    all.appendChild(el);
  });
  if(untracked.length===0){ all.innerHTML=`<div class="empty">${icon('i-inbox')}${roomFilter?'검색 결과가 없어요':'모든 방을 추적 중이에요'}</div>`; }
  if(trackedSet.size===0){ tl.innerHTML=`<div class="empty">${icon('i-inbox')}왼쪽에서 추적할 방을 골라 추가하세요</div>`; }
  [...trackedSet].forEach(id=>{
    const r=roomById(id)||{chat_id:id};
    const el=document.createElement('div'); el.className='titem';
    const mc=(r.member_count!=null)?r.member_count+'명':'';
    el.innerHTML=`${avatarSvg(r)}<div class="rmeta"><div class="rname"><span class="txt">${esc(roomName(r))}</span></div>
      <div class="rsub">${mc}</div></div>${statBadge(id)}<span class="rm" title="추적 해제">${icon('i-x')}</span>`;
    el.querySelector('.rm').onclick=()=>{ trackedSet.delete(id); renderTransfer(); updateDirty(); };
    tl.appendChild(el);
  });
  $('#cnt-all').textContent=untracked.length;
  $('#cnt-track').textContent=trackedSet.size;
}
function updateDirty(){
  const b=$('#btn-save'), d=isDirty();
  b.disabled=!d;
  b.innerHTML=`${icon('i-save')} 저장${d?'<span class="dirtydot"></span>':''}`;
}
async function saveTracked(){
  const ids=[...trackedSet];
  try{
    await api('/api/rooms/select',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({chat_ids:ids})});
    savedSet=new Set(ids); updateDirty();
    setTimeout(loadRooms,500); // 큐 처리 후 상태 반영
  }catch(e){ /* keep dirty */ }
}
function cancelEdit(){ trackedSet=new Set(savedSet); renderTransfer(); updateDirty(); }

// ── tab2 conv list + chat ──
function renderConvList(){
  const el=$('#conv-list'); if(!el) return;
  const ids=[...savedSet];
  if(ids.length===0){ el.innerHTML=`<div class="empty" style="padding:30px 16px">${icon('i-inbox')}추적 중인 방이 없어요</div>`; return; }
  el.innerHTML='';
  ids.forEach(id=>{
    const r=roomById(id)||{chat_id:id}, s=statusOf(id);
    const d=document.createElement('div'); d.className='conv'+(id===curRoom?' on':'');
    let last='';
    if(s==='collecting') last=`<span class="mini collecting"><span class="spin"></span> 수집 중</span>`;
    else if(s==='waiting'||s==='pending'||s==='idle') last=`<span class="mini waiting">${icon('i-clock')} 대기 중 · 닫힘</span>`;
    else if(s==='done') last=`<span>${(r.collected_rows!=null?r.collected_rows:0)}행 수집됨</span>`;
    d.innerHTML=`${avatarSvg(r)}<div class="rmeta"><div class="rname"><span class="txt">${esc(roomName(r))}</span></div><div class="last">${last}</div></div>`;
    d.onclick=()=>openRoom(id);
    el.appendChild(d);
  });
}

function closeES(){ if(curES){try{curES.close();}catch(e){} curES=null;} }
function fmtTime(sec){ if(!sec)return''; const ms=sec>1e12?sec:sec*1000; const d=new Date(ms); if(isNaN(d))return'';
  const h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0'); const ap=h<12?'오전':'오후'; const h12=((h+11)%12)+1; return `${ap} ${h12}:${m}`; }
function dayKey(sec){ if(!sec)return''; const ms=sec>1e12?sec:sec*1000; const d=new Date(ms); if(isNaN(d))return'';
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`; }

// 말풍선 내용 1개(사진은 saved면 <img>, lost 면 유실, 그 외는 받는 중 스피너).
function bubbleHtml(m){
  if(m.kind==='photo'){
    if(m.media_status==='saved') return `<span class="bubble photo"><img class="pimg" src="/api/media/${curRoom}/${m.log_id}" loading="lazy" alt="사진" onclick="window.open(this.src)"></span>`;
    if(m.media_status==='lost') return `<span class="bubble plost">${icon('i-x')} 유실됨 <small>· 수집 전 만료</small></span>`;
    return `<span class="bubble ppend"><span class="spin"></span> 사진 받는 중…</span>`;
  }
  const text=(m.text!=null&&m.text!=='')?m.text:`[유형 ${m.type}]`;
  return `<span class="bubble">${esc(text)}</span>`;
}
// 이미 렌더된 행의 말풍선만 교체 — 백그라운드 사진 다운로드가 끝나면 서버가 같은 log_id 를 SSE 로 재전송한다.
function updateMsg(log,m){
  if(m.log_id==null)return;
  const row=log.querySelector(`.msg[data-lid="${m.log_id}"] .rowb`); if(!row)return;
  const old=row.querySelector('.bubble'); if(!old)return;
  old.outerHTML=bubbleHtml(m);
}
function appendMsg(log,m){
  if(m.log_id!=null){ if(renderedIds.has(m.log_id)){ updateMsg(log,m); return; } renderedIds.add(m.log_id); }
  const dk=dayKey(m.sent_at);
  if(dk && dk!==curDay){ curDay=dk; const s=document.createElement('div'); s.className='daysep'; s.textContent=dk; log.appendChild(s); }
  const me=(MY_UID!==0 && m.author_id===MY_UID);
  const el=document.createElement('div'); el.className='msg'+(me?' me':'');
  if(m.log_id!=null) el.dataset.lid=m.log_id;
  const name=m.author_name || (me?'나':('상대 '+m.author_id));
  const bubble=bubbleHtml(m);
  el.innerHTML=`${me?'':`<span class="mav" style="background:${colorOf(m.author_id)}">${icon('i-user')}</span>`}
    <div class="mbody">${me?'':`<p class="sender">${esc(name)}</p>`}
    <div class="rowb">${bubble}<span class="btime">${fmtTime(m.sent_at)}</span></div></div>`;
  log.appendChild(el);
}

// 대화방 클릭 = 그 방 **즉시 수집** 시도(POST /api/collect).
// 서버가 collecting(같은 방 수집이 이미 진행 중)이면 짧게 재시도한다 — 연타해도 중복 수집은 안 돈다.
async function collectRoom(id, alive){
  // 서버가 키 재harvest(수십 초)를 백그라운드로 돌리는 동안 collecting 이 이어진다 → 최대 90s 까지 대기.
  const deadline=Date.now()+90000;
  while(Date.now()<deadline){
    let res=null;
    try{
      res=await api('/api/collect',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({chat_id:String(id)})});
    }catch(e){ return {status:'error',rows:0}; }
    if(!alive()) return null;
    if(res.status!=='collecting') return res;
    await sleep(800);
    if(!alive()) return null;
  }
  return {status:'collecting',rows:0};
}

let openSeq=0;
async function openRoom(id){
  const seq=++openSeq;
  curRoom=id; renderedIds=new Set(); curDay=null; closeES();
  renderConvList();
  const r=roomById(id)||{chat_id:id};
  $('#chat-title').textContent=roomName(r);
  const kl=kindLabel(r.kind), mc=(r.member_count!=null)?r.member_count+'명':'';
  $('#chat-sub').textContent=(kl?kl:'')+(kl&&mc?' · ':'')+(mc||'');
  const log=$('#chat-log');
  // 이 열기 요청이 아직 최신인지(다른 방 클릭·같은 방 재클릭 시 옛 요청은 조용히 폐기).
  const alive=()=>(seq===openSeq && curRoom===id);

  // 이미 수집된 방(done)은 바로 렌더. 그 외에는 저장 상태만 믿고 "대기 중"을 띄우지 않고
  // 능동 수집을 시도한다 — 앱이 "닫힘"으로 오판한 방도 실제로 열려 있으면 여기서 수집된다.
  if(statusOf(id)!=='done'){
    log.innerHTML=`<div class="state-mid"><div class="ring"></div><h3>수집 중입니다</h3><p>대화를 복호해 가져오는 중이에요. 잠시만 기다려 주세요.</p></div>`;
    const res=await collectRoom(id,alive);
    if(!alive()) return;
    // 상태·행수 갱신(추적 편집 중일 수 있으므로 ROOMS 만 교체 — savedSet/trackedSet 은 건드리지 않는다).
    try{ ROOMS=await api('/api/rooms'); renderConvList(); }catch(e){}
    if(!alive()) return;
    const st=res?res.status:'error';
    if(st==='waiting'||st==='not_tracked'){
      log.innerHTML=`<div class="state-mid"><div class="waiticon">${icon('i-clock')}</div><h3>대기 중</h3><p>이 방은 지금 닫혀 있어요. 카톡에서 방을 열거나 메시지가 오면 자동으로 수집합니다.</p></div>`;
      return;
    }
    if(st!=='done'){
      log.innerHTML=`<div class="state-mid"><div class="waiticon">${icon('i-x')}</div><h3>수집하지 못했어요</h3><p>잠시 후 방을 다시 눌러 주세요.</p></div>`;
      return;
    }
  }
  log.innerHTML='';
  let rows=[]; try{ rows=await api(`/api/messages?chat_id=${id}&limit=1000`); }catch(e){}
  if(!alive()) return;
  if(!rows.length){ log.innerHTML=`<div class="state-mid"><div class="waiticon">${icon('i-inbox')}</div><h3>메시지가 없습니다</h3><p>수집된 대화가 아직 없어요.</p></div>`; }
  else{ for(const m of rows) appendMsg(log,m); log.scrollTop=log.scrollHeight; }
  subscribe(id);
}
function subscribe(id){
  closeES();
  const es=new EventSource(`/api/stream?chat_id=${id}`); curES=es;
  es.addEventListener('message',e=>{
    if(id!==curRoom)return; let m; try{m=JSON.parse(e.data);}catch(_){return;}
    const log=$('#chat-log'); const nb=log.scrollHeight-log.scrollTop-log.clientHeight<80;
    appendMsg(log,m); if(nb) log.scrollTop=log.scrollHeight;
  });
}

// ── tabs + boot ──
const tabs=[...document.querySelectorAll('.tab')];
tabs.forEach(t=>t.addEventListener('click',()=>tabs.forEach(x=>{const on=x===t;
  x.setAttribute('aria-selected',on);$('#'+x.getAttribute('aria-controls')).hidden=!on;})));
$('#btn-save').onclick=saveTracked;
$('#btn-cancel').onclick=cancelEdit;
$('#btn-reset').onclick=async()=>{
  if(!confirm('모든 수집 데이터(대화방·메시지·사진)와 추적 설정을 지웁니다.\n카카오톡 원본은 그대로예요.\n\n다른 사람이 이 PC 를 쓰기 전에 초기화할 때 사용하세요. 진행할까요?')) return;
  const b=$('#btn-reset'); b.disabled=true;
  try{
    await api('/api/reset',{method:'POST'});
    // 클라이언트 상태도 비우고 다시 로드.
    trackedSet=new Set(); savedSet=new Set(); loadedOnce=false;
    curRoom=null; renderedIds=new Set();
    await loadState(); await loadRooms(); updateDirty();
    alert('초기화 완료. 이제 카카오톡을 로그아웃한 뒤 새 계정으로 로그인하고, 트레이에서 이 앱을 종료했다가 다시 실행하세요.');
  }catch(e){ alert('초기화 실패: '+e.message); }
  finally{ b.disabled=false; }
};
$('#room-search').oninput=(e)=>{ roomFilter=e.target.value.trim().toLowerCase(); renderTransfer(); };

async function boot(){
  await loadState(); await loadRooms(); updateDirty();
  setInterval(loadState,4000);
  setInterval(()=>{ if(!isDirty()){ loadRooms(); } else { // 편집 중이면 상태만 갱신
      api('/api/rooms').then(rows=>{ROOMS=rows;renderTransfer();renderConvList();}).catch(()=>{}); } },3000);
}
boot();
</script>
